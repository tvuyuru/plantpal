<!-- Login page: collects an email and password and sends them to the server's /login endpoint -->
<!DOCTYPE html>
<html>
    <head>
        <title>PlantPal - Login</title>
        <link rel="stylesheet" href="css/style.css">
        <!-- Theme script: loaded in the head so the saved light/dark choice shows before the page renders -->
        <script src="js/theme.js"></script>
    </head>

    <body>
        <!-- Site header: logo on the left, nav links on the right -->
        <header class="site-header">
            <a class="logo" href="index.html">🌿 PlantPal</a>
            <nav class="site-nav">
                <!-- Navigation: relative links to every page; the active class applies the highlighted style. -->
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="plants.html">My Plants</a>
                <a href="add-plant.html">Add Plant / AI</a>
                <a href="profile.html">Profile</a>
                <!-- Login link: js/user.js hides it once someone is logged in -->
                <a class="active" id="login_link" href="login.html">Login</a>
                <!-- signup link: js/user.js hides it once someone is logged in -->
                <a id="signup_link" href="register.html">Sign Up</a>
                <!-- Logged-in user: hidden until js/user.js finds a saved login and fills it in -->
                <span id="user_name" class="user-name" hidden></span>
                <!-- Log out link: hidden until someone is logged in; js/user.js clears the saved login when it is clicked -->
                <a id="logout_link" href="index.html" hidden>Log out</a>
                <!-- Light/dark switch: js/theme.js handles the click and updates the label -->
                <button type="button" id="theme_toggler" class="theme-toggle" aria-pressed="false">🌙 Dark</button>
            </nav>
        </header>

        <div class="wrap">
            <h1>Login</h1>

            <!-- Login form.
                 action: the server endpoint that checks the username and password (/login in server.js)
                 method="POST": sends the fields in the request body, so the password never appears in the address bar -->
            <form class="box box-narrow" id="login_form" action="/login" method="POST" novalidate>
                <div id="form_message" class="form-message" role="alert" hidden></div>
                <!-- Each label is tied to its input by matching for/id, so clicking the label focuses the box -->
                <label for="username">Username</label>
                <!-- name="..." must match the field name server.js reads from req.body -->
                <input type="text" id="username" name="username" autocomplete="username" required>

                <!-- The password field is type="password" so the browser hides what the user types -->
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <!-- Submit button: type="submit" so the browser sends the form to the server when clicked -->
                <button type="submit" class="btn btn-full">Log in</button>
            </form>
        </div>

         <!-- Footer: brand, tagline and copyright (same on every page) -->
        <footer class="page-footer">
            <p class="footer-logo">🌿 PlantPal</p>
            <p>A simple way to keep your houseplants healthy.</p>
            <p>© 2026 PlantPal</p>
        </footer>

        <!-- User script: at the end of the body so the user_name span in header above already exists when it runs -->
        <script src="js/user.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
